<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Will You Be My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  color: #fff;
  text-align: center;
  overflow-x: hidden;
}

section {
  min-height: 100vh;
  display: none;
  padding: 40px 20px;
}

section.active { display: block; }

h1, h2 { margin-bottom: 20px; }

button {
  padding: 14px 26px;
  font-size: 16px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  margin: 10px;
}

.yes { background:#ff4d6d; color:#fff; }
.defyes { background:#ff006e; color:#fff; }
.no {
  background:#333;
  color:#fff;
  position:absolute;
}

.cards {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  margin-top:30px;
}

.card {
  perspective:1000px;
}

.card-inner {
  height:240px;
  transition:transform 0.8s;
  transform-style:preserve-3d;
  cursor:pointer;
}

.card-inner.flipped {
  transform:rotateY(180deg);
}

.face {
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.front {
  background:rgba(255,255,255,0.25);
}

.back {
  background:#fff;
  color:#333;
  transform:rotateY(180deg);
  flex-direction:column;
}

.back img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

.toggle {
  margin-top:30px;
  font-size:18px;
}

.popup {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.popup.show { display:flex; }

.popup-box {
  background:#fff;
  color:#333;
  padding:30px;
  border-radius:20px;
  max-width:320px;
}
</style>
</head>

<body>

<!-- STEP 1 -->
<section id="step1" class="active">
  <h1>Will you be my Valentine, <b>Sweashika</b>? 💕</h1>

  <button class="yes" onclick="goYes()">Yes 💖</button>
  <button class="defyes" onclick="goDef()">Definitely Yes 😍</button>
  <button class="no" id="noBtn">No 😏</button>
</section>

<!-- STEP 2 -->
<section id="step2">
  <h2>Okay… but what about a *halfway yes*? 😉</h2>
  <p>Try this halfway yes and see how beautiful our <b>2026</b> might be ✨</p>

  <button class="yes" onclick="goCards()">Halfway Yes 💫</button>
  <button class="no" id="partialNo">Partial No 😌</button>
</section>

<!-- STEP 3 -->
<section id="step3">
  <h2>Our Beautiful Future 💞</h2>

  <div class="cards" id="cards"></div>
</section>

<!-- STEP 4 -->
<section id="step4">
  <h2>Love you ammu ❤️</h2>

  <div class="toggle">
    <label>
      <input type="checkbox" onchange="showCoupon()" />
      Renew our love 💍
    </label>
  </div>
</section>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h2>🎉 Hurray!!! 🎉</h2>
    <p>You won a coupon to the <b>Best Biryani in Hyderabad</b> 🍗🔥</p>
    <p><b>Kisses 😘 Hugs 🤗 from him</b></p>
    <button onclick="closePopup()">Aww ❤️</button>
  </div>
</div>

<script>
const sections = ["step1","step2","step3","step4"];
const noBtn = document.getElementById("noBtn");
const partialNo = document.getElementById("partialNo");

function show(id){
  sections.forEach(s=>document.getElementById(s).classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* No button escape */
function dodge(btn){
  btn.style.left = Math.random()*80 + "%";
  btn.style.top = Math.random()*80 + "%";
}
noBtn.onmouseover = ()=>dodge(noBtn);
partialNo.onmouseover = ()=>dodge(partialNo);

/* Navigation */
function goYes(){ show("step2"); }
function goDef(){ show("step4"); }
function goCards(){ show("step3"); }

/* Cards */
const topics = [
  "Health & Fitness",
  "Work & Business Growth",
  "Our First Flight ✈️",
  "Small Pep Talks",
  "Building Business Together",
  "Trips & Adventures",
  "Viewpoint Cuddles",
  "Romantic Talks",
  "Outfits & Accessories",
  "Independent World, Dependent Hearts"
];

const cards = document.getElementById("cards");
topics.forEach(t=>{
  const card = document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <div class="card-inner">
      <div class="face front">${t}</div>
      <div class="face back">
        <img src="https://picsum.photos/300/200?random=${Math.random()}">
        <p>${t}<br><b>With love, trust & laughter 💖</b></p>
      </div>
    </div>`;
  card.onclick=()=>card.querySelector(".card-inner").classList.toggle("flipped");
  cards.appendChild(card);
});

/* Popup */
function showCoupon(){
  document.getElementById("popup").classList.add("show");
}
function closePopup(){
  document.getElementById("popup").classList.remove("show");
}
</script>

</body>
</html>
