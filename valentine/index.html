<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  text-align: center;
  color: #fff;
  overflow-x: hidden;
}
.container { padding: 30px; }

h1, h2 { margin-bottom: 15px; }

button {
  padding: 12px 22px;
  font-size: 16px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  margin: 10px;
}

.yes { background: #ff4d6d; color: white; }
.defyes { background: #ff006e; color: white; }

.no {
  background: #444;
  color: white;
  position: absolute;
}

.hidden { display: none; }

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
  gap: 20px;
  margin-top: 30px;
}

.card {
  perspective: 1000px;
}

.card-inner {
  width: 100%;
  height: 220px;
  transition: transform 0.8s;
  transform-style: preserve-3d;
  cursor: pointer;
}

.card:hover .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.front {
  background: rgba(255,255,255,0.2);
}

.back {
  background: white;
  color: #333;
  transform: rotateY(180deg);
  flex-direction: column;
}

img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
}

.toggle {
  margin-top: 30px;
}

.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
}

.popup-box {
  background: white;
  color: #333;
  padding: 30px;
  border-radius: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Will you be my Valentine, <b>Sweashika</b>? 💕</h1>

<button class="yes" onclick="showPartial()">Yes 💖</button>
<button class="defyes" onclick="showDef()">Definitely Yes 😍</button>

<button class="no" id="noBtn">No 😏</button>

<div id="partial" class="hidden">
  <h2>Okay… what about a *halfway yes*? 😉</h2>
  <p>Just try this halfway yes and see how beautiful our <b>2026</b> might be ✨</p>
  <button class="yes" onclick="showCards()">Halfway Yes 💫</button>
</div>

<div id="cards" class="hidden">
  <h2>Our Beautiful Future 💞</h2>

  <div class="cards">
    <!-- Repeat cards -->
    <script>
      const topics = [
        "Health & Fitness",
        "Work & Business Growth",
        "Our First Flight ✈️",
        "Small Pep Talks",
        "Building Business Together",
        "Trips & Adventures",
        "Viewpoint Cuddles",
        "Romantic Talks",
        "Outfits & Accessories",
        "Independent World, Dependent Hearts"
      ];

      document.write(
        topics.map(t => `
        <div class="card">
          <div class="card-inner">
            <div class="card-face front">${t}</div>
            <div class="card-face back">
              <img src="https://picsum.photos/300/200?random=${Math.random()}">
              <p>${t}<br><b>With love, trust & laughter 💖</b></p>
            </div>
          </div>
        </div>
        `).join('')
      );
    </script>
  </div>
</div>

<div id="def" class="hidden">
  <h2>Love you ammu ❤️</h2>

  <div class="toggle">
    <label>
      <input type="checkbox" onchange="showCoupon()"> Renew our love 💍
    </label>
  </div>
</div>

</div>

<div id="popup" class="popup hidden">
  <div class="popup-box">
    <h2>🎉 Hurray!!! 🎉</h2>
    <p>You won a coupon to the <b>Best Biryani in Hyderabad</b> 🍗🔥</p>
    <p><b>Kisses 😘 Hugs 🤗 from him</b></p>
    <button onclick="closePopup()">Aww ❤️</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
  noBtn.style.left = Math.random() * 80 + "%";
  noBtn.style.top = Math.random() * 80 + "%";
});

function showPartial() {
  document.getElementById("partial").classList.remove("hidden");
}

function showCards() {
  document.getElementById("cards").classList.remove("hidden");
}

function showDef() {
  document.getElementById("def").classList.remove("hidden");
}

function showCoupon() {
  document.getElementById("popup").classList.remove("hidden");
}

function closePopup() {
  document.getElementById("popup").classList.add("hidden");
}
</script>

</body>
</html>
